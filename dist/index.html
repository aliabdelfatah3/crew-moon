<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crew Moon - Every Frame Tells a Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700;900&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-CnEpIVML.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CVWX5yCf.css">
  </head>
  <body
    class="bg-black text-white font-['Outfit',sans-serif] overflow-x-hidden"
  >
    <!-- Cinematic Enhancements -->
    <div class="ambient-spotlight"></div>

    <!-- Navbar -->
    <nav
      class="fixed top-0 left-0 w-full z-50 px-6 py-4 flex justify-between items-center bg-black/30 backdrop-blur-md border-b border-white/5"
    >
      <!-- Logo -->
      <a href="#" class="flex-shrink-0">
        <img
          src=""
          data-src="/img/logo.jpg"
          alt="Crew Moon"
          class="h-16 w-20 lazy-img"
        />
      </a>

      <!-- Desktop Links -->
      <div
        class="hidden md:flex items-center gap-8 text-sm font-medium tracking-widest uppercase"
      >
        <a href="#" class="bg-blue-600/80 backdrop-blur-md px-4 py-2 rounded-lg"
          >Home</a
        >
        <a href="#" class="hover:text-blue-400 transition-colors"
          >Film Projects</a
        >
        <a href="#" class="hover:text-blue-400 transition-colors">Production</a>
        <a href="#" class="hover:text-blue-400 transition-colors">AI Content</a>
        <a href="#" class="hover:text-blue-400 transition-colors"
          >Food Photography</a
        >
      </div>

      <!-- Hamburger Button (Mobile) -->
      <button
        id="menu-toggle"
        class="md:hidden flex flex-col gap-1.5 p-2 group"
        aria-label="Toggle Menu"
      >
        <span
          id="bar1"
          class="block w-6 h-0.5 bg-white transition-all duration-300 group-[.open]:rotate-45 group-[.open]:translate-y-2"
        ></span>
        <span
          id="bar2"
          class="block w-6 h-0.5 bg-white transition-all duration-300 group-[.open]:opacity-0"
        ></span>
        <span
          id="bar3"
          class="block w-6 h-0.5 bg-white transition-all duration-300 group-[.open]:-rotate-45 group-[.open]:-translate-y-2"
        ></span>
      </button>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div
      id="mobile-menu"
      class="fixed inset-0 z-40 bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center gap-10 text-lg font-bold tracking-[0.3em] uppercase translate-x-full transition-transform duration-500 ease-in-out md:hidden"
    >
      <a href="#" class="bg-blue-600/80 px-6 py-3 rounded-lg">Home</a>
      <a href="#" class="hover:text-blue-400 transition-colors"
        >Film Projects</a
      >
      <a href="#" class="hover:text-blue-400 transition-colors">Production</a>
      <a href="#" class="hover:text-blue-400 transition-colors">AI Content</a>
      <a href="#" class="hover:text-blue-400 transition-colors"
        >Food Photography</a
      >
    </div>

    <!-- Hero Section -->
    <section
      id="hero-section"
      class="relative h-screen w-full flex items-end justify-center overflow-hidden perspective-1000 pb-24"
    >
      <div class="absolute inset-0 z-0 text-white">
        <video
          id="hero-video"
          class="w-full h-full object-cover opacity-80 scale-105 pointer-events-none"
          autoplay
          muted
          playsinline
        >
          <source src="" type="video/mp4" />
        </video>
        <div
          class="absolute inset-0 bg-linear-to-t from-black via-black/20 to-transparent"
        ></div>
      </div>

      <div
        id="hero-content"
        class="relative z-10 text-center px-6 max-w-5xl transition-transform duration-300 ease-out will-change-transform"
      >
        <h1
          id="hero-title"
          class="text-7xl md:text-[120px] font-black tracking-[0.2em] mb-2 uppercase leading-none"
        ></h1>
        <p
          id="hero-subtitle"
          class="text-xs md:text-sm tracking-[0.5em] uppercase text-blue-400 mb-8 font-bold"
        ></p>

        <div class="space-y-4 max-w-3xl mx-auto">
          <p
            id="hero-description"
            class="text-sm md:text-base text-slate-300 font-light leading-relaxed"
          ></p>
          <p
            id="hero-cta-tag"
            class="text-[10px] md:text-xs text-slate-400 uppercase tracking-widest font-medium"
          ></p>
        </div>
      </div>

      <button
        id="mute-btn"
        class="absolute bottom-6 right-8 z-20 w-10 h-10 flex items-center justify-center bg-white/5 hover:bg-white/10 backdrop-blur-md rounded-full border border-white/10 transition-all active:scale-90"
      >
        <svg
          id="mute-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 4.702a.705.705 0 0 0-1.203-.498L5.413 8.582H3a1 1 0 0 0-1 1v4.836a1 1 0 0 0 1 1h2.413l4.385 4.38a.705.705 0 0 0 1.202-.498V4.702Z"
          />
          <line x1="16" x2="22" y1="9" y2="15" />
          <line x1="22" x2="16" y1="9" y2="15" />
        </svg>
      </button>
    </section>

    <!-- Image Divider Strip -->
    <section class="relative w-full overflow-hidden py-12 bg-black">
      <div
        id="image-strip"
        class="flex gap-4 px-4 overflow-x-auto no-scrollbar md:grid md:grid-cols-5 md:overflow-visible"
      ></div>
    </section>

    <!-- About Section -->
    <section
      id="about"
      class="relative py-24 px-8 md:px-24 bg-black overflow-hidden"
    >
      <div
        class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16"
      >
        <div
          class="w-full md:w-1/2 space-y-8 reveal opacity-0 translate-y-10 transition-all duration-1000"
        >
          <div class="flex items-center gap-4">
            <div class="w-12 h-px bg-blue-500"></div>
            <span
              id="about-header"
              class="text-blue-500 tracking-[0.4em] uppercase text-xs font-bold"
            ></span>
          </div>
          <h2
            id="about-title"
            class="text-4xl md:text-5xl font-bold leading-tight"
          ></h2>
          <p
            id="about-description"
            class="text-slate-400 text-lg leading-relaxed"
          ></p>
          <div class="pt-4">
            <a href="#" class="inline-flex items-center gap-4 group">
              <span class="text-sm uppercase tracking-[0.3em] font-bold"
                >Learn More</span
              >
              <div
                class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-all"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
              </div>
            </a>
          </div>
        </div>
        <div
          class="w-full md:w-1/2 reveal opacity-0 translate-x-10 transition-all duration-1000 delay-300"
        >
          <div class="relative group">
            <div
              class="absolute -inset-4 border border-blue-500/20 translate-x-4 translate-y-4 group-hover:translate-x-2 group-hover:translate-y-2 transition-transform duration-500"
            ></div>
            <div
              class="relative aspect-square overflow-hidden bg-slate-900 rounded-sm"
            >
              <img
                id="about-main-image"
                src=""
                alt="Crew Moon Studio"
                class="w-full h-full object-cover"
              />
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Services Section -->
    <section
      id="services-section"
      class="relative py-32 px-8 md:px-24 bg-linear-to-b from-black to-slate-950"
    >
      <div class="max-w-7xl mx-auto">
        <div
          class="text-center mb-20 reveal opacity-0 translate-y-10 transition-all duration-1000"
        >
          <h2
            id="services-header"
            class="text-xs tracking-[0.6em] uppercase text-blue-500 font-bold mb-4"
          ></h2>
          <h3
            id="services-title"
            class="text-5xl md:text-7xl font-bold uppercase italic tracking-tighter"
          ></h3>
        </div>
        <div
          id="services-grid"
          class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 mb-20"
        ></div>
        <div
          class="flex justify-center reveal opacity-0 translate-y-10 transition-all duration-1000"
        >
          <button
            class="relative px-12 py-5 bg-transparent border border-blue-500/50 rounded-full group overflow-hidden hover:border-blue-400 transition-colors duration-500 magnetic"
          >
            <span
              id="services-cta"
              class="relative z-10 text-sm font-bold uppercase tracking-[0.4em] transition-colors duration-500 group-hover:text-black"
            ></span>
            <div
              class="absolute inset-0 bg-blue-500 -translate-x-full group-hover:translate-x-0 transition-transform duration-500 ease-out"
            ></div>
          </button>
        </div>
      </div>
    </section>

    <!-- Clients Section -->
    <section
      id="clients-section"
      class="py-24 bg-black overflow-hidden border-t border-white/5"
    >
      <div class="max-w-7xl mx-auto px-8 md:px-24 mb-16 text-center">
        <p
          id="clients-title"
          class="text-slate-400 text-sm md:text-base tracking-widest uppercase font-medium reveal opacity-0 translate-y-10 transition-all duration-1000"
        ></p>
      </div>

      <div
        class="relative w-full overflow-hidden reveal opacity-0 transition-all duration-1000 delay-300"
      >
        <!-- Fade Edges -->
        <div
          class="absolute inset-y-0 left-0 w-32 bg-linear-to-r from-black to-transparent z-10"
        ></div>
        <div
          class="absolute inset-y-0 right-0 w-32 bg-linear-to-l from-black to-transparent z-10"
        ></div>

        <div
          id="clients-slider"
          class="animate-marquee flex gap-16 md:gap-32 items-center"
        >
          <!-- Logos will be injected here twice for infinite loop -->
        </div>
      </div>
    </section>

    <!-- Showreel Section -->
    <section
      id="showreel-section"
      class="relative h-[80vh] w-full overflow-hidden bg-black flex items-center justify-center"
    >
      <!-- Parallax Video Background -->
      <div id="showreel-video-container" class="absolute inset-0 z-0">
        <video
          id="showreel-video"
          class="w-full h-full object-cover opacity-70 scale-125 pointer-events-none"
          autoplay
          muted
          loop
          playsinline
        >
          <source src="" type="video/mp4" />
        </video>
        <div
          class="absolute inset-0 bg-linear-to-b from-black via-transparent to-black"
        ></div>
      </div>

      <!-- Content Overlay -->
      <div class="relative z-10 text-center px-6 max-w-4xl space-y-6">
        <h2
          id="showreel-title"
          class="text-xs tracking-[0.6em] uppercase text-blue-500 font-bold reveal opacity-0 translate-y-10 transition-all duration-1000"
        ></h2>
        <h3
          id="showreel-tagline"
          class="text-4xl md:text-6xl font-bold uppercase italic tracking-tighter reveal opacity-0 translate-y-10 transition-all duration-1000 delay-200"
        ></h3>

        <div
          class="pt-8 reveal opacity-0 translate-y-10 transition-all duration-1000 delay-400"
        >
          <button
            class="group relative py-2 text-sm font-bold uppercase tracking-[0.4em] transition-all magnetic"
          >
            <span
              id="showreel-cta"
              class="transition-all duration-500 group-hover:text-blue-400 group-hover:drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]"
            ></span>
            <div
              class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-500 transition-all duration-500 group-hover:w-full group-hover:shadow-[0_0_15px_rgba(59,130,246,0.8)]"
            ></div>
          </button>
        </div>
      </div>
    </section>

    <!-- Providers Section -->
    <section
      id="providers-section"
      class="relative py-32 bg-slate-950 overflow-hidden border-t border-white/5"
    >
      <div
        class="relative z-10 max-w-7xl mx-auto px-8 md:px-24 mb-24 text-center"
      >
        <h2
          id="providers-header"
          class="text-xs tracking-[0.8em] uppercase text-indigo-400 font-bold mb-6 reveal opacity-0 translate-y-10 transition-all duration-1000"
        ></h2>
        <p
          id="providers-title"
          class="text-4xl md:text-6xl font-black uppercase italic tracking-tighter text-transparent bg-clip-text bg-linear-to-b from-white to-white/20 reveal opacity-0 translate-y-10 transition-all duration-1000 delay-100"
        ></p>
      </div>

      <div class="relative perspective-2000 z-10">
        <div
          id="providers-slider"
          class="isometric-wall animate-isometric-marquee flex gap-12 items-center px-32"
        >
          <!-- Logos will be injected here as floating cards -->
        </div>
      </div>
    </section>

    <!-- Contact Section -->
    <footer
      id="contact-section"
      class="relative py-48 bg-black overflow-hidden border-t border-white/5"
    >
      <div class="absolute inset-0 z-0">
        <div
          class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-125 bg-blue-600/10 blur-[120px] rounded-full"
        ></div>
      </div>

      <div class="relative z-10 max-w-4xl mx-auto px-8 text-center space-y-12">
        <h2
          id="contact-header"
          class="text-xs tracking-[0.8em] uppercase text-blue-500 font-bold reveal opacity-0 translate-y-10 transition-all duration-1000"
        ></h2>

        <div class="space-y-4">
          <h3
            id="contact-title"
            class="text-4xl md:text-7xl font-bold uppercase italic tracking-tighter reveal opacity-0 translate-y-10 transition-all duration-1000 delay-200"
          ></h3>
        </div>

        <div
          class="pt-8 reveal opacity-0 translate-y-10 transition-all duration-1000 delay-400"
        >
          <a
            href="mailto:hello@crewmoon.com"
            class="group relative inline-block py-4 px-12 bg-white text-black font-black uppercase text-sm tracking-[0.3em] overflow-hidden rounded-sm transition-transform active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.2)] magnetic"
          >
            <span id="contact-cta" class="relative z-10"></span>
            <div
              class="absolute inset-0 bg-blue-500 translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-out"
            ></div>
          </a>
        </div>

        <div
          class="pt-24 flex flex-col items-center gap-6 reveal opacity-0 transition-all duration-1000 delay-600"
        >
          <div class="w-12 h-px bg-white/20"></div>
          <p
            class="text-[10px] tracking-[0.5em] uppercase text-slate-500 font-bold"
          >
            Crew Moon Studio &copy; 2024
          </p>
        </div>
      </div>
    </footer>

  </body>
</html>
